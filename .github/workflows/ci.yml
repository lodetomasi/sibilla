name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Clean install from pyproject (reproducibility gate)
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: Run test suite
        run: PYTHONPATH=src .venv/bin/python -m pytest -q
