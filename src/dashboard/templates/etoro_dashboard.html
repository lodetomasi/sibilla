<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>SIBILLA — eToro equities desk</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#0b0d11;--surface:#11141a;--surface2:#151922;--hair:#1e232d;--hair2:#2a303c;
  --text:#d7dbe4;--muted:#8d93a1;--dim:#6d7380;
  --up:#31b487;--dn:#e5484d;--warn:#d9a03f;--acc:#6c94ff;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:12.5px/1.5 var(--sans)}
header{display:flex;align-items:baseline;gap:14px;padding:9px 16px;border-bottom:1px solid var(--hair);
  position:sticky;top:0;z-index:5;background:var(--bg);flex-wrap:wrap;row-gap:6px}
h1{font:600 12.5px var(--sans);margin:0;letter-spacing:.02em}
h1 small{color:var(--dim);font-weight:400}
.hspace{flex:1}
.stat{font:500 11px var(--mono);color:var(--muted);white-space:nowrap}
.stat b{color:var(--text);font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim);display:inline-block;margin-right:7px}
.dot.ok{background:var(--up)}.dot.bad{background:var(--dn)}
main{padding:12px 16px 48px;display:grid;gap:10px;grid-template-columns:repeat(12,1fr)}
section{grid-column:span 12;min-width:0}
.half{grid-column:span 6}
@media (max-width:1100px){.half{grid-column:span 12}}
h2{display:flex;align-items:baseline;gap:10px;margin:6px 0 6px;
  font:600 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h2::after{content:"";flex:1;border-top:1px solid var(--hair);transform:translateY(-2px)}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--hair);border-radius:3px;overflow:hidden}
th{text-align:left;font:600 10px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--dim);
   padding:7px 10px;border-bottom:1px solid var(--hair2);background:var(--surface2)}
td{padding:6px 10px;font:500 11.5px var(--mono);border-bottom:1px solid var(--hair);color:var(--text)}
tr:last-child td{border-bottom:none}
.up{color:var(--up)}.dn{color:var(--dn)}.warn{color:var(--warn)}.dim{color:var(--dim)}
.empty{padding:16px;color:var(--dim);font:500 11.5px var(--mono);text-align:center}
</style>
</head>
<body>
<header>
  <h1>SIBILLA <small>eToro equities desk</small></h1>
  <div class="hspace"></div>
  <span class="stat" id="mode"><span class="dot" id="dot"></span><b id="mode-val">—</b></span>
  <span class="stat">equity <b id="equity">—</b></span>
  <span class="stat">disponibile <b id="available">—</b></span>
  <span class="stat">universo max <b id="max-price">—</b></span>
</header>
<main>
  <section>
    <h2>Posizioni aperte</h2>
    <table id="positions-table">
      <thead><tr><th>Strumento</th><th>Direzione</th><th>Size</th><th>Apertura</th><th>Stop</th><th>Target</th></tr></thead>
      <tbody id="positions-body"><tr><td colspan="6" class="empty">caricamento…</td></tr></tbody>
    </table>
  </section>
  <section>
    <h2>Attività recente</h2>
    <table id="feed-table">
      <thead><tr><th>Ora (UTC)</th><th>Evento</th><th>Dettaglio</th></tr></thead>
      <tbody id="feed-body"><tr><td colspan="3" class="empty">caricamento…</td></tr></tbody>
    </table>
  </section>
</main>
<script>
function fmt(n, d=2){ return (typeof n === "number") ? n.toFixed(d) : "—"; }

async function refresh() {
  try {
    const [status, balance, positions, feed] = await Promise.all([
      fetch("/api/etoro/status").then(r => r.json()),
      fetch("/api/etoro/balance").then(r => r.json()).catch(() => null),
      fetch("/api/etoro/positions").then(r => r.json()).catch(() => []),
      fetch("/api/etoro/feed").then(r => r.json()).catch(() => []),
    ]);

    document.getElementById("mode-val").textContent = status.mode || "—";
    document.getElementById("dot").className = "dot " + (status.etoro_configured ? "ok" : "bad");
    document.getElementById("max-price").textContent = status.max_penny_price_usd ? "$" + status.max_penny_price_usd : "—";
    if (balance) {
      document.getElementById("equity").textContent = fmt(balance.equity) + " " + (balance.currency || "");
      document.getElementById("available").textContent = fmt(balance.available) + " " + (balance.currency || "");
    }

    const posBody = document.getElementById("positions-body");
    if (!positions.length) {
      posBody.innerHTML = '<tr><td colspan="6" class="empty">nessuna posizione aperta</td></tr>';
    } else {
      posBody.innerHTML = positions.map(p => `<tr>
        <td>${p.epic}</td><td class="${p.direction === 'BUY' ? 'up' : 'dn'}">${p.direction}</td>
        <td>${fmt(p.size, 0)}</td><td>${fmt(p.level)}</td>
        <td class="dn">${fmt(p.stop_level)}</td><td class="up">${fmt(p.limit_level)}</td>
      </tr>`).join("");
    }

    const feedBody = document.getElementById("feed-body");
    if (!feed.length) {
      feedBody.innerHTML = '<tr><td colspan="3" class="empty">nessuna attività registrata</td></tr>';
    } else {
      feedBody.innerHTML = feed.map(f => {
        const cls = f.event.includes("failed") ? "dn" : f.event.includes("no_") ? "dim" : "text";
        const detail = Object.entries(f.detail || {}).map(([k, v]) => `${k}=${v}`).join(" · ");
        return `<tr><td class="dim">${f.ts}</td><td class="${cls}">${f.label}</td><td>${detail}</td></tr>`;
      }).join("");
    }
  } catch (e) {
    console.error(e);
  }
}

refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
