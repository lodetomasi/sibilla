[project]
name = "automatic-trading-bot"
version = "0.1.0"
description = "AI Market Intelligence & Automated Trading System"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "websockets>=13",
    "tenacity>=9",
    "sqlalchemy>=2.0",
    "greenlet>=3.1",
    "lightstreamer-client-lib>=2.0",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "redis>=5.2",
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "rapidfuzz>=3.10",
    "orjson>=3.10",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "cryptography>=43",
    "anthropic>=0.39",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    # on-chain execution path (Base): required by the live Limitless pipeline
    "web3>=6.20,<7",
    "eth-account>=0.10",
    "limitless-sdk>=1.1",
]

[project.optional-dependencies]
ml = ["lightgbm>=4.5", "xgboost>=2.1"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
    "freezegun>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/core", "src/collectors", "src/wallet", "src/market", "src/intelligence",
    "src/quant", "src/risk", "src/execution", "src/evaluation", "src/strategies",
    "src/workers", "src/alerts", "src/api", "src/dashboard",
]

[tool.pytest.ini_options]
addopts = "-p no:pytest_ethereum"  # plugin web3 rotto (conflitto eth_typing), non ci serve
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501", "B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
